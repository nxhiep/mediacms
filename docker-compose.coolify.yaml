# Compose file for deploying on Coolify.
# Unlike docker-compose.yaml, the source tree is NOT bind-mounted: Coolify's
# project directory does not contain the repo, so the mount would hide the code
# baked into the image. Persistent data lives in named volumes instead.
# The image is built from this repo (target: base) so local changes apply.
#
# Required/optional env vars (set in Coolify > Environment Variables):
#   SERVICE_FQDN_WEB_80          - assigned by Coolify when a domain is set on "web"
#   SERVICE_PASSWORD_POSTGRES    - auto-generated by Coolify
#   SERVICE_BASE64_64_SECRETKEY  - auto-generated by Coolify, used as Django SECRET_KEY
#   CSRF_TRUSTED_ORIGINS         - optional, comma-separated (defaults to FRONTEND_HOST)
#   ADMIN_PASSWORD               - initial admin password (random if empty, see migrations logs)
#   ADMIN_EMAIL                  - initial admin email

x-mediacms-env: &mediacms-env
  FRONTEND_HOST: ${SERVICE_URL_WEB:-http://localhost}
  POSTGRES_HOST: db
  POSTGRES_NAME: mediacms
  POSTGRES_USER: mediacms
  POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-mediacms}
  REDIS_LOCATION: redis://redis:6379/1
  SECRET_KEY: ${SERVICE_BASE64_64_SECRETKEY}

services:
  migrations:
    build:
      context: .
      target: base
    image: mediacms-coolify:latest
    volumes:
      - media_store:/home/mediacms.io/mediacms/media_files/
      - static_store:/home/mediacms.io/mediacms/static/
    environment:
      <<: *mediacms-env
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ADMIN_USER: 'admin'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: "./deploy/docker/prestart.sh"
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: base
    image: mediacms-coolify:latest
    expose:
      - "80"
    volumes:
      - media_store:/home/mediacms.io/mediacms/media_files/
      - static_store:/home/mediacms.io/mediacms/static/
    environment:
      <<: *mediacms-env
      SERVICE_FQDN_WEB_80: ${SERVICE_FQDN_WEB_80:-}
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
    restart: unless-stopped
    depends_on:
      - migrations
  celery_beat:
    build:
      context: .
      target: base
    image: mediacms-coolify:latest
    environment:
      <<: *mediacms-env
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
    restart: unless-stopped
    depends_on:
      - redis
  celery_worker:
    build:
      context: .
      target: base
    image: mediacms-coolify:latest
    volumes:
      - media_store:/home/mediacms.io/mediacms/media_files/
      - static_store:/home/mediacms.io/mediacms/static/
    environment:
      <<: *mediacms-env
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_MIGRATIONS: 'no'
    restart: unless-stopped
    depends_on:
      - migrations
  db:
    image: postgres:17.2-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always
    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-mediacms}
      POSTGRES_DB: mediacms
      TZ: Europe/London
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: "redis:alpine"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  media_store:
  static_store:
